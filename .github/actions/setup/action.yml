# spec: docs/repo/ci.md#timing-and-caching
name: Set up checks
description: Restore local caches and install locked dependencies
inputs:
  key:
    required: true
    description: Independent job cache namespace
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.3
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          .turbo/cache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.key }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ inputs.key }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'pnpm-lock.yaml') }}-
    - shell: bash
      run: |
        rustc --version
        pnpm install --frozen-lockfile
