[package]
name = "yaai-lints"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
shell-words = "1"
noyalib = { version = "0.0.64", default-features = false, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
