# spec: docs/repo/ci.md
# BP-CI-004, BP-CI-009, BP-CI-011, BP-CI-018, INV-CI-001
name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
  TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
  TURBO_TELEMETRY_DISABLED: '1'
  TURBO_CACHE: local:rw
defaults:
  run:
    shell: bash
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          key: lint
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          mkdir -p ci-bin
          tar -xzf actionlint.tar.gz -C ci-bin actionlint
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
      - run: |
          exec > >(tee "$RUNNER_TEMP/check.log") 2>&1
          bin/lint
          bin/doc-links check
          pnpm format:check
          actionlint .github/workflows/check.yml
      - &failure-log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/check.log
          if-no-files-found: ignore
          retention-days: 7
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: ./.github/actions/setup
        with:
          key: typecheck
      - run: |
          exec > >(tee "$RUNNER_TEMP/check.log") 2>&1
          pnpm exec turbo run typecheck --continue ${TURBO_SCM_BASE:+--affected}
          pnpm exec tsc --noEmit
      - *failure-log
  build:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: ./.github/actions/setup
        with:
          key: build
      - run: |
          exec > >(tee "$RUNNER_TEMP/check.log") 2>&1
          pnpm exec turbo run build --continue ${TURBO_SCM_BASE:+--affected}
          test -z "$(git status --porcelain)"
      - *failure-log
  test:
    runs-on: ${{ matrix.os }}
    outputs:
      timing_1: ${{ steps.snapshot.outputs.timing_1 }}
      timing_2: ${{ steps.snapshot.outputs.timing_2 }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [1, 2]
    steps:
      - *checkout
      - uses: ./.github/actions/setup
        with:
          key: test-${{ matrix.shard }}
      - name: Restore timing snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          bash .github/ci/restore-timings.sh
          digest=$(sha256sum "$RUNNER_TEMP/base.json" | cut -d ' ' -f 1)
          echo "timing_$SHARD=$digest" >> "$GITHUB_OUTPUT"
      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          exec > >(tee "$RUNNER_TEMP/check.log") 2>&1
          CI_TIMINGS_BASE="$RUNNER_TEMP/base.json" CI_TIMINGS_OUT="$RUNNER_TEMP/shard-$SHARD.json" bash .github/ci/test.sh "$SHARD" 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: timings-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-*.json
          if-no-files-found: error
          retention-days: 7
      - *failure-log
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, typecheck, build, test]
    steps:
      - name: Check every job result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success") and
            (.test.outputs | (.timing_1 | length) == 64 and .timing_1 == .timing_2)' <<< "$RESULTS"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'push'
        with:
          pattern: timings-ubuntu-latest-*
          path: timings
          merge-multiple: true
      - if: github.event_name == 'push'
        run: jq -s '{version:1, files:(map(.files) | add)}' timings/shard-*.json > base.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: main-timings
          path: base.json
          retention-days: 90
          overwrite: true
